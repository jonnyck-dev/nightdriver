<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NIGHT DRIVER | NEON OVERDRIVE</title>
    <style>
        body { margin: 0; padding: 0; background: #000; color: #0ff; font-family: 'Courier New', monospace; overflow: hidden; display: flex; justify-content: center; align-items: center; height: 100vh; }
        #game-container { position: relative; width: 640px; height: 480px; border: 4px solid #0ff; box-shadow: 0 0 30px #0ff; }
        canvas { display: block; background: #000; }
        .overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; background: rgba(0,0,0,0.85); text-align: center; z-index: 10; }
        h1 { font-size: 3rem; margin: 0; text-shadow: 0 0 10px #0ff, 0 0 20px #f0f; color: #fff; }
        .btn { margin-top: 20px; padding: 15px 30px; border: 2px solid #0ff; background: transparent; color: #0ff; cursor: pointer; font-family: inherit; font-size: 1.2rem; transition: 0.3s; }
        .btn:hover { background: #0ff; color: #000; box-shadow: 0 0 20px #0ff; }
        #stats { position: absolute; top: 10px; left: 10px; text-align: left; pointer-events: none; z-index: 5; }
        .hidden { display: none !important; }
        #msg { font-size: 1.5rem; color: #f0f; margin-bottom: 20px; }
    </style>
</head>
<body>
    <div id="game-container">
        <canvas id="gameCanvas"></canvas>
        
        <!-- Pantalla Inicial -->
        <div id="start-screen" class="overlay">
            <h1>NIGHT DRIVER</h1>
            <p style="color: #f0f;">NEON OVERDRIVE</p>
            <div style="margin-top: 20px; text-align: center; font-size: 0.9rem; line-height: 1.5;">
                <p style="color: #fff; margin-bottom: 15px;">
                    <strong>OBJETIVO:</strong> Sobrevive a la velocidad.<br>
                    Esquiva los bloques rojos y rompe el High Score.<br>
                    <em>¡A más velocidad, más puntos!</em>
                </p>
                <div style="display: inline-block; text-align: left; color: #0ff;">
                    [↑] ACELERAR <br>
                    [↓] FRENAR <br>
                    [←][→] ESQUIVAR
                </div>
            </div>
            <button class="btn" onclick="startGame()">INICIAR CARRERA</button>
        </div>

        <!-- Pantalla de Fin de Juego -->
        <div id="end-screen" class="overlay hidden">
            <h1 id="end-title">FIN DE CARRERA</h1>
            <div id="msg"></div>
            <div id="final-stats"></div>
            <button class="btn" onclick="startGame()">REINTENTAR</button>
        </div>

        <div id="stats">
            <div id="speed">VELOCIDAD: 0 KM/H</div>
            <div id="score">SCORE: 0000</div>
            <div id="highscore">HIGH SCORE: 0000</div>
        </div>
    </div>
    <script src="game.js"></script>
    <script>
        function startGame() {
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('end-screen').classList.add('hidden');
            initGame();
        }
    </script>
</body>
</html>
